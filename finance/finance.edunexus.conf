# ============================================================
#  Nginx Config — finance.edunexus.net  (Standalone Subdomain)
#  ضعه في: /etc/nginx/sites-available/finance.edunexus.conf
#  ثم شغّله: sudo ln -s /etc/nginx/sites-available/finance.edunexus.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo nginx -s reload
# ============================================================

server {
    listen 80;
    server_name finance.edunexus.net www.finance.edunexus.net;

    root /var/www/html/finance;     # <-- المجلد الجديد على السيرفر
    index index.php index.html;

    client_max_body_size 50M;

    # PHP Processing
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;   # غيّره لو PHP-FPM على socket مختلف
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Normal Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block sensitive dirs
    location ^~ /config/     { deny all; }
    location ^~ /controllers/{ deny all; }
    location ^~ /models/     { deny all; }
    location ~ /\.(git|env|htaccess) { deny all; }
    location ~ \.(sql|zip|tar|gz|log)$ { deny all; }
}
